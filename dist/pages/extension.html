<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAIR Chance© - Extension</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
  <script type="module" crossorigin src="../assets/extension-MTPKgqbx.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="../assets/utils-BIuvQIPN.js">
  <link rel="stylesheet" crossorigin href="../assets/style-DKpqm1-Y.css">
</head>
<body>
  <h1>Extension</h1>
  <h3 style="margin-bottom: 1px;">ALLOW CAMERA ACCESS</h3>
  <h4>(Reload this website if camera is NOT starting)</h4>
  
  <p id="instruction">
    Raise one of your fingers up while keeping it straight.<br>
    (Select other fingers below to measure extension of those fingers).
  </p>

  <div id="container">
    <video id="input_video" autoplay playsinline style="display:none;"></video>
    <!-- <canvas id="output_canvas"></canvas> -->
    <canvas id="output_canvas"></canvas>
  </div>
  <div id="feedback"></div>

    <fieldset>
    <legend>Select Finger to Measure:</legend>
    <div id="radio_buttons">
      <label>
        <input id="rdIndexF" type="radio" name="modeGrp" value="indexF" checked>
        Index-Finger
      </label>

      <label for="rdMiddleF">
        <input id="rdMiddleF" type="radio" name="modeGrp" value="middleF">
        Middle-Finger
      </label>

      <label for="rdRingF">
        <input id="rdRingF" type="radio" name="modeGrp" value="ringF">
        Ring-Finger
      </label>

      <label for="rdLittleF">
        <input id="rdLittleF" type="radio" name="modeGrp" value="littleF">
        Little-Finger
      </label>

      <label for="rdAllF">
        <input id="rdAllF" type="radio" name="modeGrp" value="allF">
        All Fingers
      </label>
    </div>
  </fieldset>

  <button id="exportButton">Export Data</button>

  <button id="backButton" onclick="location.href='../index.html'">Back to Home</button>
</body>
</html>
