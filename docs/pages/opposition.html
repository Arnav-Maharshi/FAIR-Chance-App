<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAIR Chance© - Opposition</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <h1>Opposition</h1>
  <h3 style="margin-bottom: 0vh;">ALLOW CAMERA ACCESS</h3>
  <h4>(Reload this website if camera is NOT starting)</h4>

  <p id="instruction">
    Touch the tip of your thumb to the tip of each finger on the same hand <br>
    (Select other finger-thumb pairs below).
  </p>
  <div id="container">
    <video id="input_video" autoplay playsinline style="display:none;"></video>
    <!-- <canvas id="output_canvas" width="640" height="480"></canvas>-->
    <canvas id="output_canvas"></canvas>
    <div id="loadingSpinner" class="loading"></div>
  </div>
  <div id="feedback"></div>

  <fieldset>
    <legend>Select Finger-Thumb Pair:</legend>
    <div id="radio_buttons">
      <label>
        <input id="rdIndexF" type="radio" name="modeGrp" value="indexF" checked
          onclick="mode = 'THIS IS Index-Finger';">
        Index-Finger & Thumb
      </label>

      <label for="rdMiddleF">
        <input id="rdMiddleF" type="radio" name="modeGrp" value="middleF">
        Middle-Finger & Thumb
      </label>

      <label for="rdRingF">
        <input id="rdRingF" type="radio" name="modeGrp" value="ringF">
        Ring-Finger & Thumb
      </label>

      <label for="rdLittleF">
        <input id="rdLittleF" type="radio" name="modeGrp" value="littleF">
        Little-Finger & Thumb
      </label>

      <label for="rdAllF">
        <input id="rdAllF" type="radio" name="modeGrp" value="allF">
        All Fingers
      </label>
    </div>
  </fieldset>

  <button id="exportButton">Export Data</button>

  <button id="backButton" onclick="location.href='../index.html'">Back to Home</button>
  <script type="module" src="../js/opposition.js"></script>
</body>

</html>
