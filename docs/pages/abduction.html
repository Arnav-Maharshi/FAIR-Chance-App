<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAIR Chance© - Abduction</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <h1>Abduction</h1>
  <h3 style="margin-bottom: 0vh;">ALLOW CAMERA ACCESS</h3>
  <h4>(Reload this website if camera is NOT starting)</h4>

  <p id="instruction">
    Spread your fingers apart while keeping them straight
  </p>
  <div id="container">
    <video id="input_video" autoplay playsinline style="display:none;"></video>
    <!-- <canvas id="output_canvas" width="640" height="480"></canvas>-->
    <canvas id="output_canvas"></canvas>
    <div id="loadingSpinner" class="loading"></div>
  </div>
  <div id="feedback"></div>

   <fieldset>
    <legend>Select Finger(s) to Measure:</legend>
    <div id="radio_buttons">
      <label>
        <input id="rdIMRL" type="radio" name="modeGrp" value="modeIMRL" checked>
        Index, Middle, Ring & Little Finger
      </label>

      <label for="rdThumb">
        <input id="rdThumb" type="radio" name="modeGrp" value="modethumb">
        Thumb
      </label>
    </div>
  </fieldset>

  <button id="exportButton">Export Data</button>
  
  <button id="backButton" onclick="location.href='../index.html'">Back to Home</button>
  <script type="module" src="../js/abduction.js"></script>
</body>

</html>
